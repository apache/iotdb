####################
### IoTDB Edge Tuning
####################
# The following defaults are tuned for the edge distribution: ConfigNode and
# DataNode run in ONE JVM with a small fixed memory budget (see conf/edge-env.sh),
# sharing the machine with other processes. Validated on x86 and Raspberry Pi 4B.

# ---- thread pools (small fixed sizes instead of CPU-core-based defaults) ----
query_thread_count=2
degree_of_query_parallelism=1
mpp_data_exchange_core_pool_size=2
mpp_data_exchange_max_pool_size=2
flush_thread_count=2
compaction_thread_count=2
sub_compaction_thread_count=1
compaction_schedule_thread_num=1
pipe_subtask_executor_max_thread_num=2
pipe_sink_selector_number=1
pipe_sink_max_client_number=8
continuous_query_submit_thread_count=1
into_operation_execution_thread_count=1
procedure_core_worker_thread_count=2
partition_table_recover_worker_num=2
max_sub_task_num_for_information_table_scan=1
load_active_listening_max_thread_num=1
dn_selector_thread_nums_of_client_manager=1
cn_selector_thread_nums_of_client_manager=1
max_allowed_concurrent_queries=100

# ---- memory / file buffers ----
wal_buffer_size_in_byte=1048576
group_size_in_byte=4194304
target_chunk_point_num=10000
target_chunk_size=262144
page_size_in_byte=16384
max_number_of_points_in_page=1000
into_operation_buffer_size_in_byte=8388608
batch_size=10000
schema_region_ratis_log_appender_buffer_size_max=4194304
config_node_ratis_log_appender_buffer_size_max=4194304

# ---- compaction working set ----
candidate_compaction_task_queue_size=10
compaction_max_aligned_series_num_in_one_batch=2
target_compaction_file_size=33554432
inner_compaction_total_file_size_threshold=52428800
inner_compaction_total_file_num_threshold=10
inner_compaction_candidate_file_num=8
max_cross_compaction_candidate_file_num=10
max_cross_compaction_candidate_file_size=52428800

# ---- background io politeness (share disks with other processes) ----
compaction_write_throughput_mb_per_sec=8
partition_table_recover_max_read_mb_per_sec=5

# ---- single-node region / partition layout ----
schema_region_group_extension_policy=CUSTOM
default_schema_region_group_num_per_database=1
data_region_group_extension_policy=CUSTOM
default_data_region_group_num_per_database=1
series_slot_num=1

# ---- metrics off (the internal MetricService is shared by both nodes) ----
cn_metric_level=OFF
dn_metric_level=OFF

# ---- realtime pipe sync out of the box ----
# The pipe memory pool is 10% of the heap (~22MB at the default 224M budget),
# while the stock pipe memory estimates are sized for datacenter nodes: each
# pipe reserves a 15MB insert-node queue and estimates ~18MB more at task
# startup, so CREATE PIPE fails on an untuned edge node. Shrink the per-pipe
# queue budget and skip the startup estimation; actual allocations stay
# elastic within the pool, degrading to batched TsFile transfer on pressure.
# Validated on Raspberry Pi 4B: one realtime pipe ('history.enable'='false')
# forwarding a 100-points/s load adds ~20MB RSS and syncs with sub-second
# latency (single-record p99 < 500ms).
pipe_insert_node_queue_memory=2097152
pipe_enable_memory_checked=false
pipe_logger_cache_max_size_in_bytes=1048576