name: Logical Backup Daily IT

on:
  pull_request:
    branches:
      - feat/pipe-logical-backup-sink
    paths:
      - .github/workflows/logical-backup-daily-it.yml
      - integration-test/src/test/java/org/apache/iotdb/pipe/it/dual/treemodel/manual/IoTDBPipeLogicalBackupIT.java

concurrency:
  group: logical-backup-daily-it-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  logical-backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: 17
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Cache Maven packages
        uses: actions/cache@v5
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-
      - name: Run logical backup daily IT
        run: >-
          mvn -B -ntp clean verify
          -Pwith-integration-tests
          -DskipUTs
          -Dit.test=IoTDBPipeLogicalBackupIT
          -Dfailsafe.failIfNoSpecifiedTests=false
          -DintegrationTest.forkCount=1
          -DConfigNodeMaxHeapSize=256
          -DDataNodeMaxHeapSize=1024
          -DDataNodeMaxDirectMemorySize=768
          -DClusterConfigurations=ScalableSingleNodeMode,ScalableSingleNodeMode
          -Drat.skip=true
          -pl integration-test
          -am
          -PMultiClusterIT2DualTreeManual
