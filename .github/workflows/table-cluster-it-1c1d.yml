name: Table Cluster IT - 1C1D

on:
  push:
    branches:
      - master
      - "rel/*"
      - "rc/*"
    paths-ignore:
      - "docs/**"
      - "site/**"
      - "iotdb-client/client-cpp/**"
      - ".github/workflows/client-cpp-package.yml"
      - ".github/scripts/package-client-cpp-*.sh"
      - ".github/workflows/multi-language-client.yml"
  pull_request:
    branches:
      - master
      - "rel/*"
      - "rc/*"
      - "force_ci/**"
    paths-ignore:
      - "docs/**"
      - "site/**"
      - "iotdb-client/client-cpp/**"
      - ".github/workflows/client-cpp-package.yml"
      - ".github/scripts/package-client-cpp-*.sh"
      - ".github/workflows/multi-language-client.yml"
  # allow manually run the action:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MAVEN_OPTS: -Dhttp.keepAlive=false -Dmaven.wagon.http.pool=false -Dmaven.wagon.http.retryHandler.class=standard -Dmaven.wagon.http.retryHandler.count=3
  MAVEN_ARGS: --batch-mode --no-transfer-progress
  DEVELOCITY_ACCESS_KEY: ${{ secrets.DEVELOCITY_ACCESS_KEY }}

jobs:
  # This draft stress-test workflow intentionally runs only IoTDBConcurrentCreateTableIT.
  Ubuntu:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: 17
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Cache Maven packages
        uses: actions/cache@v5
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-
      - name: Adjust Linux kernel somaxconn
        shell: bash
        run: sudo sysctl -w net.core.somaxconn=65535
      - name: IT/UT Test
        shell: bash
        run: |
          mvn clean verify \
          -P with-integration-tests \
          -DskipUTs \
          -Dit.test=IoTDBConcurrentCreateTableIT \
          -DfailIfNoTests=false -Dfailsafe.failIfNoSpecifiedTests=false \
          -DintegrationTest.forkCount=1 -DConfigNodeMaxHeapSize=1024 -DDataNodeMaxHeapSize=1024 \
          -pl integration-test \
          -am -PTableSimpleIT
      - name: Upload Artifact
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: table-standalone-log-Linux
          path: integration-test/target/cluster-logs
          retention-days: 1

  Windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: 17
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Cache Maven packages
        uses: actions/cache@v5
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-
      - name: Adjust network dynamic TCP ports range
        shell: pwsh
        run: |
          netsh int ipv4 set dynamicport tcp start=32768 num=32768
          netsh int ipv4 set dynamicport udp start=32768 num=32768
          netsh int ipv6 set dynamicport tcp start=32768 num=32768
          netsh int ipv6 set dynamicport udp start=32768 num=32768
      - name: IT/UT Test
        shell: bash
        run: |
          mvn clean verify \
          -P with-integration-tests \
          -DskipUTs \
          -Dit.test=IoTDBConcurrentCreateTableIT \
          -DfailIfNoTests=false -Dfailsafe.failIfNoSpecifiedTests=false \
          -DintegrationTest.forkCount=1 -DConfigNodeMaxHeapSize=1024 -DDataNodeMaxHeapSize=1024 \
          -pl integration-test \
          -am -PTableSimpleIT
      - name: Upload Artifact
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: table-standalone-log-Windows
          path: integration-test/target/cluster-logs
          retention-days: 1
