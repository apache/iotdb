[IoTDB]
Driver=Apache IoTDB ODBC Driver
SERVER=127.0.0.1
PORT=6667
UID=root
DATABASE=information_schema
ISTABLEMODEL=1
SSL=0
; For TLS set SSL=1 and SSLCA to a trusted PEM CA file.
; SSLCA=/etc/iotdb/ca.pem
; For mutual TLS also set both of these PEM file paths:
; SSLCERT=/etc/iotdb/client.pem
; SSLKEY=/etc/iotdb/client.key
